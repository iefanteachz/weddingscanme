<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Photo Drop</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6ECE1;--ink:#1F3A2E;--card:#fff;--gold:#A9832F;--line:#C9D3C3;--muted:#587064;--err:#9B2C2C}
@media (prefers-color-scheme:dark){:root{--bg:#14241C;--ink:#EAF0E6;--card:#1D3328;--gold:#D4AE5A;--line:#2F4A3B;--muted:#9DB5A6;--err:#F19A9A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:32px 20px 48px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(2.6rem,12vw,3.6rem);line-height:1;margin:0 0 6px;font-weight:700}
.sub{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.25rem;color:var(--gold);margin:0 0 24px}
p.lead{margin:0 0 24px;line-height:1.55;color:var(--muted)}
label.name{display:block;font-weight:500;margin-bottom:6px}
input[type=text]{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:20px}
.actions{display:grid;gap:12px}
button,.btn{font:inherit;font-weight:700;padding:18px;border-radius:14px;border:0;cursor:pointer;text-align:center;display:block}
.primary{background:var(--ink);color:var(--bg);font-size:1.1rem}
.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=file]{display:none}
#list{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:10px}
#list li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
#list img{width:52px;height:52px;object-fit:cover;border-radius:8px}
.meta{flex:1;min-width:0;font-size:.9rem}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.st{font-size:.85rem;font-weight:700}
.done .st{color:var(--gold)}.fail .st{color:var(--err)}
.retry{padding:6px 10px;font-size:.8rem;border-radius:8px;background:var(--ink);color:var(--bg)}
#count{margin-top:20px;color:var(--muted);font-size:.95rem}
.config-warn{background:var(--card);border:1.5px dashed var(--err);padding:12px;border-radius:10px;margin-bottom:20px;color:var(--err);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1 id="title">Irfan &amp; Icha</h1>
  <p class="sub" id="date">Majlis Bersanding</p>
  <p class="lead">Share the moments you captured with us. Your photos go straight into our wedding album. Terima kasih!</p>

  <div id="warn" class="config-warn" hidden>Setup needed: add your Apps Script URL to SCRIPT_URL in index.html.</div>

  <label class="name" for="guest">Your name</label>
  <input type="text" id="guest" placeholder="e.g. Aunty Rohani" autocomplete="name" maxlength="40">

  <div class="actions">
    <label class="btn primary" for="cam">Take a photo</label>
    <input type="file" id="cam" accept="image/*" capture="environment">
    <label class="btn secondary" for="gal">Choose from gallery</label>
    <input type="file" id="gal" accept="image/*" multiple>
  </div>

  <ul id="list" aria-live="polite"></ul>
  <p id="count"></p>
</main>

<script>
// ====== EDIT THESE ======
const SCRIPT_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQ6gzr9m_9bia867hgkqeoXwEmS4FrYYbgXB_bOUX0JrOUYKhsXhbZGB2-NYPRmDRQFmXwOS2nDmWevqanVjbynDO20mAbxjvJDpiziixhb97YZ5Iqdm75UjsD54H8WJ1xi2dIN3_1aoRq-zXXKh8e6z5hrrxNJSMPA3haj4KQvWtoEe6C3ifo_HPN5pmIKQE6xRKyLXCSN3tQJ8m-EGJWAVjYWCZkY4Lx1oclxMg5-qHs9jBy-BYmwwGNuTeRYE1AuyJAoX6kJ8kI2JvHsSgvlD5hLfg&lib=MrMidr5r-h5WOmUOZygLYuImnfMQx7RqU";
const EVENT_CODE = "";            // must match SECRET in Code.gs (leave both empty to disable)
const COUPLE     = "Irfan & Icha";
const EVENT_LINE = "Majlis Bersanding";
const MAX_SIDE   = 2000;          // photos are resized to this longest edge before upload
// ========================

document.getElementById('title').textContent = COUPLE;
document.getElementById('date').textContent = EVENT_LINE;
if (SCRIPT_URL.startsWith('PASTE')) document.getElementById('warn').hidden = false;

const list = document.getElementById('list'), countEl = document.getElementById('count');
const guestEl = document.getElementById('guest');
try { guestEl.value = localStorage.getItem('guestName') || ''; } catch (e) {}
guestEl.addEventListener('input', () => { try { localStorage.setItem('guestName', guestEl.value); } catch (e) {} });

let sent = 0;
const queue = [];
let busy = false;

['cam', 'gal'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('change', () => {
    [...el.files].forEach(addFile);
    el.value = '';
    pump();
  });
});

function addFile(file) {
  const li = document.createElement('li');
  const img = document.createElement('img');
  img.src = URL.createObjectURL(file);
  img.alt = '';
  const meta = document.createElement('div'); meta.className = 'meta';
  const st = document.createElement('div'); st.className = 'st'; st.textContent = 'Waiting';
  const bar = document.createElement('div'); bar.className = 'bar'; bar.innerHTML = '<i></i>';
  meta.append(st, bar);
  li.append(img, meta);
  list.prepend(li);
  queue.push({ file, li, st, bar: bar.firstChild, meta });
}

async function pump() {
  if (busy) return;
  busy = true;
  while (queue.length) {
    const job = queue.shift();
    await upload(job);
  }
  busy = false;
}

function toJpegBase64(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const s = Math.min(1, MAX_SIDE / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    im.onerror = () => reject(new Error('Could not read this image'));
    im.src = url;
  });
}

async function upload(job) {
  const { li, st, bar, meta } = job;
  li.classList.remove('fail');
  st.textContent = 'Uploading…'; bar.style.width = '35%';
  try {
    const data = await toJpegBase64(job.file);
    bar.style.width = '65%';
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ data, mime: 'image/jpeg', guest: guestEl.value || 'Guest', code: EVENT_CODE })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Upload failed');
    bar.style.width = '100%';
    li.classList.add('done'); st.textContent = 'Saved to album';
    sent++; countEl.textContent = sent + (sent === 1 ? ' photo' : ' photos') + ' shared. Thank you!';
  } catch (err) {
    li.classList.add('fail'); bar.style.width = '0';
    st.textContent = 'Failed: ' + (err.message || 'check your connection');
    const b = document.createElement('button');
    b.className = 'retry'; b.textContent = 'Retry';
    b.onclick = () => { b.remove(); queue.push(job); pump(); };
    meta.append(b);
  }
}
</script>
</body>
</html>
